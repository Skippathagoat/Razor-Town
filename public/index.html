<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07070d">
<title>Razor Town — City of the Wire, 2026</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#129440;</text></svg>">
<link rel="stylesheet" href="css/fonts.css?v=g6">
<link rel="stylesheet" href="css/style.css?v=g6">
</head>
<body>
<canvas id="fx-layer" aria-hidden="true"></canvas>
<div id="float-layer" aria-hidden="true"></div>

<!-- ============ AUTH SCREEN ============ -->
<section id="screen-auth" class="screen active">
  <div class="city-bg" style="background-image:url('img/bg-city.jpg')"></div>
  <div class="auth-shell">
    <div class="auth-logo">
      <img src="img/emblem.png" alt="" width="72" height="72">
      <div class="auth-title">RAZOR<span class="cityword">TOWN</span></div>
      <div class="auth-sub">2026. The Wire never sleeps. Keep your pockets deep and your back to the wall.</div>
      <div class="auth-online" id="auth-online">connecting to the yard…</div>
    </div>
    <div class="auth-card" id="auth-card"></div>
  </div>
  <div class="auth-ticker" id="auth-ticker"></div>
</section>

<!-- ============ CREATOR SCREEN ============ -->
<section id="screen-creator" class="screen">
  <div class="city-bg" style="background-image:url('img/bg-city.jpg')"></div>
  <div class="creator-wrap" id="creator-wrap"></div>
</section>

<!-- ============ GAME SCREEN — sidebar yard + top points line, torn-grammar shell ============ -->
<section id="screen-game" class="screen">
  <aside id="side">
    <button class="side-logo" data-nav="city" title="Razor Town — home">
      <img src="img/emblem.png" alt="">
      <span class="sl-word">RAZOR<em>TOWN</em></span>
      <span class="sl-year">'26</span>
    </button>
    <nav id="rail" class="rail"></nav>
  </aside>
  <div class="side-scrim" data-act="side_toggle"></div>
  <div id="main-col">
    <header id="hud" class="hud"></header>
    <main id="view" class="view"></main>
  </div>
  <footer id="mobile-nav" class="mobile-nav"></footer>
  <div id="gmg" class="gmg"></div>
</section>

<!-- modals -->
<div id="modal-root"></div>
<div id="toast-root"></div>

<!-- audio -->
<audio id="sfx-bell" preload="auto"></audio>

<script src="js/avatar.js?v=g6"></script>
<script src="js/net.js?v=g6"></script>
<script src="js/ui.js?v=g6"></script>
<script src="js/app.js?v=g6"></script>
</body>
</html>
